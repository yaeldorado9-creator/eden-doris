name: Build Eden (Doris)

on:
  push:
    branches: [main]
    paths: ['nightly/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doris-build
  cancel-in-progress: false

jobs:
  android:
    name: Doris nightly update
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SCCACHE_GHA_ENABLED: "true"
      DORIS_TAG: doris-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /

      - name: Install host tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y glslang-tools libvulkan-dev g++

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Fetch the exact working nightly and apply only the new patches
        run: |
          SHA=$(python3 -c 'import json; print(json.load(open("nightly/base.json"))["commit"])')
          SERVER=$(python3 -c 'import json; print(json.load(open("nightly/base.json"))["server"])')
          MIRROR=$(python3 -c 'import json; print(json.load(open("nightly/base.json"))["mirror"])')
          git init -q eden
          git -C eden fetch -q --depth 1 "$SERVER" "$SHA" || git -C eden fetch -q --depth 1 "$MIRROR" "$SHA"
          git -C eden checkout -q --detach FETCH_HEAD
          test "$(git -C eden rev-parse HEAD)" = "$SHA"
          for patch in nightly/patches/*.patch; do
            git -C eden apply --check "../$patch"
            git -C eden apply "../$patch"
          done
          python3 nightly/check-source.py eden
          python3 nightly/test-worker.py eden
          echo "DORIS_VERSION_CODE=$(( ($(date +%s) - 1451606400) / 10 ))" >> "$GITHUB_ENV"

      - name: Restore downloaded dependencies
        uses: actions/cache@v4
        with:
          path: eden/.cache/cpm
          key: cpm-nightly-${{ hashFiles('nightly/base.json', 'nightly/patches/**') }}
          restore-keys: cpm-

      - name: Build one Doris release APK
        env:
          GIT_TAG_NAME: ${{ env.DORIS_TAG }}-nightly-7a6d055094
        run: |
          sdkmanager 'build-tools;36.0.0'
          cd eden/src/android
          chmod +x gradlew
          ./gradlew assembleDorisRelease --no-daemon --stacktrace -Pnightly=false \
            -PYUZU_ANDROID_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          cd ../..
          mkdir -p ../out
          mapfile -t APKS < <(find src/android/app/build/outputs/apk/doris/release -name '*.apk')
          test "${#APKS[@]}" = 1
          cp "${APKS[0]}" "../out/Eden-Doris-${{ github.run_number }}.apk"

      - name: Verify it updates existing Doris
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download doris-40 --repo "$GITHUB_REPOSITORY" -p Eden-Doris-40-a.apk -D previous
          python3 nightly/check-apk.py "$ANDROID_HOME/build-tools/36.0.0" \
            previous/Eden-Doris-40-a.apk "out/Eden-Doris-${{ github.run_number }}.apk" | tee out/update-check.txt
          cd out
          sha256sum *.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Eden-Doris-${{ github.run_number }}
          path: out/
          if-no-files-found: error

      - name: Release the Doris update candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Updates the existing Eden (Doris) installation. Do not uninstall Doris first.

          Based on working Eden nightly 7a6d055094. Keeps Doris's package and signing certificate, with a higher version code. The build verifies these against Doris 40.

          Only native change: avoid unnecessary Vulkan worker and queue-drain wakeups. Historical Doris graphics patches and Lun changes are excluded. Rendering, GPU barriers, texture handling, vertex tracking and frame generation retain the pinned nightly's implementation.

          Select your existing Turnip Gen8 V38 and match the working nightly's per-game and UltraCam settings. No replacement driver is bundled.

          Candidate for on-device testing. A successful build and synchronization tests do not establish an FPS gain or graphics correctness on the Thor.
          NOTES
          cat out/update-check.txt >> notes.md
          gh release create "$DORIS_TAG" out/*.apk out/SHA256SUMS.txt out/update-check.txt \
            --repo "$GITHUB_REPOSITORY" --title "Eden (Doris) ${{ github.run_number }} — nightly update candidate" \
            --notes-file notes.md --target "${{ github.sha }}" --prerelease
