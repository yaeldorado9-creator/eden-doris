name: Build Apex Doris driver

# Builds the Doris Turnip driver (Balemuni's Apex v2 Ultimate rebuilt from source, plus Doris
# changes for Tears of the Kingdom on Eden) from Mesa at driver/MESA_COMMIT with driver/patches,
# and publishes two zips for Eden's driver manager as a release (apex-doris-<number>):
#   Apex-Doris-<n>.zip          all patches (TotK: tiled 32-bit images, measured render modes)
#   Apex-Doris-<n>-asis.zip     patch 0001 only (Apex v2 Ultimate as it is)
on:
  push:
    branches: [main]
    paths: ['driver/**', '.github/workflows/driver.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: doris-driver
  cancel-in-progress: false

jobs:
  driver:
    name: Turnip (Android arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NUM: ${{ github.run_number }}
      NDK_VERSION: r28
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v5

      - name: Install host tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build flex bison glslang-tools ccache zip pkg-config
          pip3 install --user "meson>=1.4,<1.9" mako pyyaml packaging
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache the Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ndk
          key: ndk-${{ env.NDK_VERSION }}

      - name: Get the Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          mkdir -p ndk && unzip -q ndk.zip -d ndk && rm ndk.zip

      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ hashFiles('driver/MESA_COMMIT') }}-${{ github.run_number }}
          restore-keys: ccache-${{ hashFiles('driver/MESA_COMMIT') }}-

      - name: Get Mesa
        run: |
          mkdir mesa && cd mesa && git init -q
          git fetch -q --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git "$(cat ../driver/MESA_COMMIT)"
          git checkout -q FETCH_HEAD
          git config user.name "Apex Doris build"
          git config user.email "doris@users.noreply.github.com"

      - name: Build "Apex as is" (patch 0001)
        run: |
          cd mesa && git am -q ../driver/patches/0001-*.patch && git tag apex && cd ..
          driver/build.sh mesa ndk/android-ndk-${NDK_VERSION} out "$NUM" "Apex-Doris-${NUM}-asis.zip" "Apex v2 Ultimate as is"

      - name: Build "TotK tuned" (all patches)
        run: |
          cd mesa && for p in ../driver/patches/*.patch; do
            case "$(basename "$p")" in 0001-*) continue;; esac
            git am -q "$p"
          done && cd ..
          driver/build.sh mesa ndk/android-ndk-${NDK_VERSION} out "$NUM" "Apex-Doris-${NUM}.zip" "TotK final"
          ccache -s | head -5

      - name: Check and checksum
        run: |
          cd out
          for z in Apex-Doris-${NUM}.zip Apex-Doris-${NUM}-asis.zip; do
            unzip -l "$z"
            unzip -p "$z" vulkan.freedreno.so | strings | grep -m1 "Apex v2 Ultimate, Doris"
          done
          sha256sum Apex-Doris-${NUM}.zip Apex-Doris-${NUM}-asis.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apex-doris-${NUM}" --target "${GITHUB_SHA}" \
            --title "Apex Doris ${NUM} (driver)" \
            --notes "Turnip driver for Eden (Doris): Balemuni's Apex v2 Ultimate rebuilt from source (Mesa $(cut -c1-10 driver/MESA_COMMIT)), plus Doris changes. Apex-Doris-${NUM}.zip is the TotK driver (32-bit images tiled, render modes measured); Apex-Doris-${NUM}-asis.zip is Apex v2 Ultimate as it is. Install in Eden: GPU driver manager, install, pick the zip." \
            out/Apex-Doris-${NUM}.zip out/Apex-Doris-${NUM}-asis.zip out/SHA256SUMS.txt
